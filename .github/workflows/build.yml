name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the app
        run: ./build.sh --dist

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: SpeechToText
          path: dist/SpeechToText.zip

      - name: Publish a release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/SpeechToText.zip \
            --title "Speech to Text $GITHUB_REF_NAME" --generate-notes
